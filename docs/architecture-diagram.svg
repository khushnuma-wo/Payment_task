<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="880" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Payment Processing Service — Architecture</text>

  <!-- Client -->
  <rect x="40" y="70" width="160" height="60" rx="8" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="120" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2a6c">Client</text>
  <text x="120" y="113" text-anchor="middle" font-size="11" fill="#333">(Web / App)</text>

  <!-- Payment Gateway -->
  <rect x="40" y="420" width="160" height="60" rx="8" fill="#fff3e0" stroke="#e8870e" stroke-width="1.5"/>
  <text x="120" y="445" text-anchor="middle" font-size="14" font-weight="600" fill="#7a4a00">Payment Gateway</text>
  <text x="120" y="463" text-anchor="middle" font-size="11" fill="#333">(signed webhook)</text>

  <!-- Load Balancer -->
  <rect x="280" y="240" width="170" height="70" rx="8" fill="#e6f4ea" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="365" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#1b5e20">Load Balancer</text>
  <text x="365" y="286" text-anchor="middle" font-size="11" fill="#333">stateless routing</text>

  <!-- API instances -->
  <rect x="540" y="150" width="150" height="60" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.5"/>
  <text x="615" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#3c1b8c">API #1 (NestJS)</text>
  <text x="615" y="193" text-anchor="middle" font-size="10" fill="#333">socket.io</text>

  <rect x="540" y="240" width="150" height="60" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.5"/>
  <text x="615" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#3c1b8c">API #2 (NestJS)</text>
  <text x="615" y="283" text-anchor="middle" font-size="10" fill="#333">socket.io</text>

  <rect x="540" y="330" width="150" height="60" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.5"/>
  <text x="615" y="355" text-anchor="middle" font-size="13" font-weight="600" fill="#3c1b8c">API #N (NestJS)</text>
  <text x="615" y="373" text-anchor="middle" font-size="10" fill="#333">socket.io</text>

  <text x="615" y="420" text-anchor="middle" font-size="11" fill="#555">Every instance runs identical code —</text>
  <text x="615" y="436" text-anchor="middle" font-size="11" fill="#555">idempotency + locking live in Postgres, not in any one instance</text>

  <!-- PostgreSQL -->
  <rect x="820" y="150" width="190" height="140" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="915" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#0b4a79">PostgreSQL</text>
  <text x="915" y="194" text-anchor="middle" font-size="11" fill="#333">(source of truth)</text>
  <line x1="835" y1="204" x2="1005" y2="204" stroke="#90c2e7"/>
  <text x="915" y="222" text-anchor="middle" font-size="11" fill="#222">payments</text>
  <text x="915" y="240" text-anchor="middle" font-size="11" fill="#222">payment_events (unique gateway_event_id)</text>
  <text x="915" y="258" text-anchor="middle" font-size="11" fill="#222">outbox_events</text>
  <text x="915" y="278" text-anchor="middle" font-size="10" fill="#555">ACID tx · UNIQUE constraints · FOR UPDATE</text>

  <!-- Redis -->
  <rect x="820" y="330" width="190" height="140" rx="8" fill="#fff0f6" stroke="#c2255c" stroke-width="1.5"/>
  <text x="915" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#8a0e3c">Redis</text>
  <text x="915" y="374" text-anchor="middle" font-size="11" fill="#333">(fan-out fabric, optional)</text>
  <line x1="835" y1="384" x2="1005" y2="384" stroke="#f0a8c4"/>
  <text x="915" y="402" text-anchor="middle" font-size="11" fill="#222">socket.io pub/sub adapter</text>
  <text x="915" y="420" text-anchor="middle" font-size="11" fill="#222">outbox publish channel</text>
  <text x="915" y="438" text-anchor="middle" font-size="11" fill="#222">GET /payments/:id read cache</text>
  <text x="915" y="458" text-anchor="middle" font-size="10" fill="#555">never arbitrates financial state</text>

  <!-- Outbox relay note -->
  <rect x="540" y="500" width="470" height="56" rx="8" fill="#fef9e7" stroke="#d9a400" stroke-width="1.2"/>
  <text x="775" y="524" text-anchor="middle" font-size="12" font-weight="600" fill="#6b4e00">Outbox relay (runs inside every API instance)</text>
  <text x="775" y="542" text-anchor="middle" font-size="11" fill="#6b4e00">claims PENDING rows (atomic UPDATE) → publishes to Redis → marks PUBLISHED</text>

  <!-- WS rooms -->
  <rect x="280" y="620" width="410" height="60" rx="8" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="485" y="645" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2a6c">socket.io rooms: payment:&lt;id&gt;, user:&lt;id&gt;</text>
  <text x="485" y="663" text-anchor="middle" font-size="11" fill="#333">payment:update pushed to subscribed clients on every instance</text>

  <!-- Arrows -->
  <path d="M200,100 L365,250" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="160" font-size="10" fill="#444">HTTPS / WS</text>

  <path d="M450,265 L540,210" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M450,275 L540,275" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M450,285 L540,345" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M690,190 L820,210" fill="none" stroke="#1971c2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M690,270 L820,240" fill="none" stroke="#1971c2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M690,350 L820,270" fill="none" stroke="#1971c2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="755" y="205" font-size="10" fill="#1971c2">tx: insert + lock + update</text>

  <path d="M200,450 L365,300" fill="none" stroke="#e8870e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="390" font-size="10" fill="#8a5300">signed webhook</text>
  <text x="230" y="404" font-size="10" fill="#8a5300">(via LB, any instance)</text>

  <path d="M615,390 L700,500" fill="none" stroke="#d9a400" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M915,290 L915,330" fill="none" stroke="#555" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="925" y="312" font-size="9" fill="#555">relay reads outbox rows</text>

  <path d="M775,500 L915,470" fill="none" stroke="#d9a400" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="810" y="485" font-size="9" fill="#8a6d00">publish</text>

  <path d="M820,420 L615,390" fill="none" stroke="#c2255c" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="700" y="415" font-size="9" fill="#8a0e3c">pub/sub fan-out to every instance</text>

  <path d="M615,390 L485,620" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="520" font-size="10" fill="#243b8a">payment:update</text>

  <path d="M485,620 L200,135" fill="none" stroke="#3b5bdb" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="300" y="470" font-size="10" fill="#243b8a">real-time push to subscribed client</text>

  <!-- Legend -->
  <rect x="40" y="740" width="1120" height="110" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="60" y="765" font-size="12" font-weight="700" fill="#222">Key invariants</text>
  <text x="60" y="786" font-size="11" fill="#333">• Idempotency fence: UNIQUE(gateway_event_id) in Postgres — same store as the state it protects, no cross-system race window.</text>
  <text x="60" y="804" font-size="11" fill="#333">• Atomicity: event insert + payment update + outbox insert happen in ONE transaction — never partially visible.</text>
  <text x="60" y="822" font-size="11" fill="#333">• Redis is never the arbiter of money state — it only moves bytes (fan-out, cache). If Redis is down, HTTP + webhooks keep working; only cross-instance WS fan-out degrades.</text>
  <text x="60" y="840" font-size="11" fill="#333">• Any instance can serve any request — correctness lives in the database, not in instance-local memory.</text>
</svg>
